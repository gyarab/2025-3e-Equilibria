{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/homepage.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div id="particles-js"></div>

    <nav>
        <a href="/" class="nav-logo">
            <span class="material-symbols-outlined" style="color: var(--accent)">query_stats</span>
            EQUILIBRIA
        </a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div id="login-box" {% if register_form.errors %}style="display: none;"{% endif %}>
                <h2><span class="material-symbols-outlined">login</span> Přihlášení</h2>
                <form method="POST">
                    {% csrf_token %}
                    {{ login_form.as_p }}
                    <button type="submit" name="login_submit" class="btn-submit">Vstoupit do systému</button>
                </form>
                <button class="toggle-btn" type="button" onclick="switchForm()">Nemáte účet? Založit účet</button>
            </div>

            <div id="register-box" {% if not register_form.errors %}style="display: none;"{% endif %}>
                <h2><span class="material-symbols-outlined">person_add</span> Nová registrace</h2>
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in register_form %}
                        <div class="mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                {{ field.label }}
                                {% if field.help_text %}
                                    <div class="equilibria-css-tooltip">
                                        <span class="material-symbols-outlined help-icon">help</span>
                                        
                                        <div class="tooltip-dropdown">
                                            {{ field.help_text|safe }}
                                        </div>
                                    </div>
                                {% endif %}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="errorlist">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" name="register_submit" class="btn-submit">Vytvořit účet</button>
                </form>
                <button class="toggle-btn" type="button" onclick="switchForm()">Zpět na přihlášení</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 50 },
                color: { value: '#58a6ff' },
                opacity: { value: 0.5 },
                size: { value: 2 },
                line_linked: { enable: true, distance: 150, color: '#58a6ff', opacity: 0.1 },
                move: { enable: true, speed: 1.5 }
            }
        });
        
        // Toggle between login and registration forms
        function switchForm() {
            const loginBox = document.getElementById('login-box');
            const registerBox = document.getElementById('register-box');
            
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                registerBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';
                if (typeof initTooltips === "function") {
                    initTooltips();
                }
            }
        }
    </script>

</body>
</html>
