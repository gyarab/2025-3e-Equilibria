{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responzivní mapa ČR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/map.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <div id="particles-js"></div>
    <div class="status-bars">
        <a href="/" onclick="scrollToSection('hero')" class="nav-logo">
            <span class="material-symbols-outlined" style="color: #58a6ff">query_stats</span>
            EQUILIBRIA
        </a>
        <div class="status-bar"><span>Economy</span><div class="bar"><div id="economy" class="fill" data-value="500"></div></div></div>
        <div class="status-bar"><span>Citizen Satisfaction</span><div class="bar"><div id="satisfaction" class="fill" data-value="500"></div></div></div>
        <div>Round: <br><span id="round-counter"></span></div>
        <div class="status-bar"><span>Environment</span><div class="bar"><div id="environment" class="fill" data-value="500"></div></div></div>
        <div class="status-bar"><span>Military Power</span><div class="bar"><div id="military-power" class="fill" data-value="500"></div></div></div>
    </div>

    <div class="map-container" id="map-container">
        <svg id="map-svg" viewBox="0 0 3508 2480" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div id="game-over-screen" class="game-over-overlay hidden-overlay">
        <div class="game-over-modal">
            <h1 class="game-over-title">GAME OVER</h1>
            <p class="game-over-desc">Vaše vláda skončila. Země se propadla do chaosu.</p>
            <div class="game-over-buttons">
                <a href="/" class="game-over-btn btn-home">Home</a>
                <button id="btn-start-over" class="game-over-btn btn-restart" onclick="initializeGame()">Start Over</button>
            </div>
        </div>
    </div>

<script>
    const gameID = '{{ game.id }}';
    const regionsData = '{{ regions }}';
</script>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script src="{% static 'main/js/map.js' %}"></script>
</body>
</html>
